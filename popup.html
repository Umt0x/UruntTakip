<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8" />
<title>MediaMarkt Ürün Takip</title>
<style>
  body { width: 290px; font-family: "Segoe UI", Arial, sans-serif; padding: 14px; margin: 0; color: #222; }
  h3 { font-size: 15px; margin: 0 0 5px; }
  p.desc { font-size: 11.5px; color: #666; margin: 0 0 12px; line-height: 1.4; }
  .section { background: #f3f4f6; border-radius: 9px; padding: 10px; margin-bottom: 10px; }
  .section-title { font-size: 12.5px; font-weight: 800; margin-bottom: 7px; }
  #count { font-size: 12px; font-weight: 700; line-height: 1.5; }
  label { font-size: 12px; font-weight: 600; }
  select { width: 100%; padding: 8px; border: 1px solid #bbb; border-radius: 8px; background: white; font-weight: 700; }
  .check-row { display: flex; gap: 8px; align-items: flex-start; line-height: 1.35; }
  button { display: block; width: 100%; box-sizing: border-box; padding: 10px; margin-bottom: 8px; border: none; border-radius: 9px; font-size: 12.5px; font-weight: 800; cursor: pointer; }
  #resetPriceBtn { background: #c62828; color: #fff; }
  #exportBtn { background: #2e7d32; color: #fff; }
  #importBtn { background: #1565c0; color: #fff; }
  #status { font-size: 11.5px; color: #444; margin-top: 6px; min-height: 16px; line-height: 1.35; }
  .warning { font-size: 10.5px; color: #8b1a1a; margin-top: 5px; font-weight: 700; }
</style>
</head>
<body>
  <h3>MediaMarkt Ürün Takip</h3>
  <p class="desc">Arama platformunu seçin ve fiyat kontrol kayıtlarını yönetin. “Eklendi” kayıtları ayrı tutulur.</p>

  <div class="section">
    <div class="section-title">Ürün nerede aransın?</div>
    <select id="searchPlatform">
      <option value="hb">Hepsiburada</option>
      <option value="ty">Trendyol</option>
    </select>
  </div>

  <div class="section">
    <div id="count">Kayıtlar yükleniyor...</div>
  </div>

  <div class="section">
    <label class="check-row">
      <input type="checkbox" id="autoResetPrice" />
      <span>Fiyat kontrolü işaretlerini, işaretlendikleri aydan sonraki ay otomatik kaldır.</span>
    </label>
  </div>

  <button id="resetPriceBtn">🧹 Tüm Fiyat Kontrollerini Sıfırla</button>
  <div class="warning">Bu işlem yalnızca fiyat kontrolünü siler; “Eklendi” işaretlerine kesinlikle dokunmaz.</div>
  <br />
  <button id="exportBtn">📥 Yedeği İndir (.json)</button>
  <button id="importBtn">📤 Yedekten Geri Yükle</button>
  <input type="file" id="fileInput" accept=".json" style="display:none" />
  <div id="status"></div>
  <script src="popup.js"></script>
</body>
</html>
